version: '3.8'

services:
  # API Service
  api:
    build: ../../../apps/api
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
    depends_on:
      - db
      - vector-db

  # Web UI
  web:
    build: ../../../apps/web
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api

  # PostgreSQL Database
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-offline_llm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-offline_llm}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # Vector Database (Qdrant)
  vector-db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Inference Worker (llama.cpp)
  inference:
    image: ghcr.io/ggerganov/llama.cpp:server
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    command: >
      server
      --model /models/llama-7b-chat.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 4096
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data: